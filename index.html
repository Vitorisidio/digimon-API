<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiDex</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./rest.css">

    <script src="./app.js" defer></script>

    <!-- link para as fonts de texto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="cabecalho">
            <img src="img/Polygon 1.png" alt="poligono">
            <h1>DigiDex</h1>
        </div>
    </header>

    <main>

        <div class="inputbox">
            <input type="text" id="buscar" placeholder="insira o nome do digimon ou seu ID" required>
            <button>buscar</button>
        </div>

        <div class="containerSecao">

            <div class="secao ativa" id="secao1">
                <span>digimon</span>
            </div>

            <div class="secao" id="secao2">
                <span>fields</span>
            </div>

            <div class="secao" id="secao3">
                <span>descrição</span>
            </div>

        </div>

        <div class="containerDigimon" id="containerDigimon">

            <!-- ABA DIGIMON -->
            <div class="digimonBackground aba ativaConteudo" id="abaDigimon">

                <div class="infoDigimon" id="infoDigimon">

                    <div class="imagem">

                        <span id="numeroDigimon">83</span>

                        <div class="fotoDigimon" id="fotoDigimon"></div>

                    </div>

                    <div class="atributos">

                        <h3 id="nomeDigimon">Tailmon</h3>

                        <p>
                            <span>Level: </span>
                            <span id="level">adultChild</span>
                        </p>

                        <p>
                            <span>Attributes: </span>
                            <span id="attributes">freeVaccine</span>
                        </p>

                        <p>
                            <span>Type: </span>
                            <span id="type">Holy Beast</span>
                        </p>

                        <p>
                            <span>Release: </span>
                            <span id="release">1998</span>
                        </p>

                    </div>

                </div>

            </div>

            <!-- ABA FIELDS -->
            <div class="digimonBackground aba" id="abaFields">

                <div class="fieldsContainer" id="fieldsContainer"></div>

            </div>

            <!-- ABA DESCRIÇÃO -->
            <div class="digimonBackground aba" id="abaDescricao">

                <div class="descricaoContainer">

                    <h2>Descrição</h2>

                    <p id="textoDescricao"></p>

                </div>

            </div>

        </div>

    </main>

    <footer></footer>

</body>

</html>
